[package]
name = "zuse-computer"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "Agent-native computer use shell, native desktop control and MCP server"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zuse"
readme = "README.md"
keywords = ["computer-use", "mcp", "automation", "no-std", "agents"]
categories = ["command-line-utilities", "api-bindings", "no-std"]
include = ["scripts/**", "benches/**", "src/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README*", "LICENSE", "CHANGELOG.md"]

[lib]
name = "zuse"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["dep:zmcpio", "dep:zclap", "dep:z64", "dep:zsys"]

[dependencies]
zmcpio = { default-features = false, features = ["std"], optional = true, git = "https://github.com/LIghtJUNction/zmcpio.git"}
zclap = { default-features = false, optional = true, git = "https://github.com/LIghtJUNction/zclap.git"}
z64 = { default-features = false, optional = true, git = "https://github.com/LIghtJUNction/z64.git"}
zsys = { default-features = false, features = ["dylib"], optional = true, git = "https://github.com/LIghtJUNction/zsys.git"}

[[bin]]
name = "zuse"
path = "src/main.rs"
required-features = ["std"]

[[bench]]
name = "core"
harness = false
required-features = ["std"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
