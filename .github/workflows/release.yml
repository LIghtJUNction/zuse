name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - id: identity
        env:
          ZUSE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py verify "$ZUSE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/release.py package ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: zuse-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [identity, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          pattern: zuse-*
          merge-multiple: true
          path: dist
      - name: Publish native GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZUSE_TAG: ${{ needs.identity.outputs.tag }}
        run: python scripts/release.py publish "$ZUSE_TAG"
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate when registry credentials are configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --locked
          else
            echo "GitHub binaries published. Add CARGO_REGISTRY_TOKEN to enable crates.io publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
