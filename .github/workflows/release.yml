name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - id: identity
        env:
          ZUSE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py verify "$ZUSE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Select the Android NDK linker
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          revision=30.0.16248370
          ndk="$ANDROID_HOME/ndk/$revision"
          if [[ ! -f "$ndk/source.properties" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$revision"
          fi
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build Writer with the Linux software renderer
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libfreetype-dev libfontconfig-dev
          cargo build --locked --release --manifest-path apps/writer/Cargo.toml --features linux-software --target ${{ matrix.target }}
      - run: python scripts/release.py package ${{ matrix.target }}
      - name: Verify both executables from the Linux archive
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        env:
          ZUSE_TAG: ${{ needs.identity.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          bundle="zuse-${ZUSE_TAG}-${TARGET}"
          stage="$(mktemp -d)"
          tar -xzf "dist/$bundle.tar.gz" -C "$stage" "$bundle/zuse" "$bundle/zuse-writer" "$bundle/install-writer" "$bundle/apps/writer/zuse-writer.desktop" "$bundle/apps/writer/README.md" "$bundle/scripts/import_gfont.py" "$bundle/docs/handwriting.md"
          HOME="$stage/test-home" XDG_DATA_HOME="$stage/user data" "$stage/$bundle/install-writer"
          cmp "$stage/$bundle/zuse" "$stage/user data/zuse-writer/current/zuse"
          cmp "$stage/$bundle/zuse-writer" "$stage/test-home/.local/bin/zuse-writer"
          test -s "$stage/$bundle/apps/writer/README.md"
          version="$("$stage/$bundle/zuse" --version)"
          test "$version" = "zuse ${ZUSE_TAG#v}"
          env -u DISPLAY -u WAYLAND_DISPLAY "$stage/$bundle/zuse-writer" --help > "$stage/writer-help"
          grep -F -- '--align' "$stage/writer-help"
          grep -F -- '--kuixiang-page' "$stage/writer-help"
          "$stage/$bundle/scripts/import_gfont.py" --help > "$stage/importer-help"
          grep -F -- '--install' "$stage/importer-help"
          grep -F -- '--kuixiang-page' "$stage/$bundle/docs/handwriting.md"
      - uses: actions/upload-artifact@v7
        with:
          name: zuse-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [identity, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          pattern: zuse-*
          merge-multiple: true
          path: dist
      - name: Publish native GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZUSE_TAG: ${{ needs.identity.outputs.tag }}
        run: python scripts/release.py publish "$ZUSE_TAG"
      - name: Record GitHub-only publication
        run: echo "GitHub binaries published. Registry publication requires a separately validated registry package." >> "$GITHUB_STEP_SUMMARY"
